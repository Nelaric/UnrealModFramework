name: Bug report | 缺陷报告
description: Report a reproducible problem with the repository, tooling, or implemented framework. | 报告仓库、工具或已实现框架中可复现的问题。
title: '[Bug | 缺陷]: '
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. English and Chinese are both welcome. Please search existing issues first. Describe a reproducible problem in the current repository, tools, or implemented framework. Use a capability proposal for new behavior. Do not post tokens, credentials, or private data. | 感谢报告问题。欢迎使用英文或中文。提交前请搜索现有 Issue。请描述当前仓库、工具或已实现框架中可复现的问题；新增行为请使用能力提案。请勿公开令牌、凭据或私人数据。
  - type: textarea
    id: summary
    attributes:
      label: Problem | 问题描述
      description: What is broken? Link to the affected file or documentation page if relevant. | 哪部分出现问题？如有相关文件或文档页面，请附上链接。
      placeholder: A concise description of the problem. | 简要描述问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps | 复现步骤
      description: Provide the smallest reproducible example or exact commands. If reproduction is impossible, explain what you observed. | 提供最小复现示例或准确命令；如无法复现，请说明观察到的现象。
      placeholder: |-
        1. Set up ... | 准备环境……
        2. Run ... | 执行操作……
        3. Observe ... | 观察结果……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior | 预期行为
      placeholder: What should happen? | 预期会发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior | 实际行为
      placeholder: What happened instead? | 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment | 环境信息
      description: Give the relevant repository revision or release, UE version (5.6+ if applicable), operating system, build target (Game, Editor, standalone tool, or independent authoring plugin), and affected component. Use "not applicable" for documentation or tooling issues. | 请提供相关仓库修订或版本、UE 版本（适用时为 5.6+）、操作系统、构建目标（Game、Editor、独立命令行工具或独立制作插件）及受影响组件。文档或工具问题可填写“不适用”。
      placeholder: |-
        Repository revision or release | 仓库修订或版本：
        Unreal Engine version | Unreal Engine 版本：
        Operating system | 操作系统：
        Build target | 构建目标：
        Affected component | 受影响组件：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and supporting evidence | 日志与补充材料
      description: Add relevant log excerpts, screenshots, a minimal project, or a link to one. Redact secrets and personal data. | 附上相关日志片段、截图、最小项目或链接，并遮盖密钥与个人数据。
    validations:
      required: false
