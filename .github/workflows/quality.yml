name: Quality

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  naming:
    name: PR and commit naming
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - name: Check PR title, branch, and commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Scripts/check_git_naming.py

  format:
    name: Format and text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned formatters
        run: |
          python -m pip install clang-format==18.1.8
          dotnet tool restore
      - name: Check text conventions
        run: python Scripts/check_text.py
      - name: Test build and automation scripts
        run: python -m unittest discover -s Scripts -p 'test_*.py'
      - name: Check C++ and build-script format
        run: python Scripts/check_format.py

  api-docs:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Doxygen 1.18.0
        run: bash Scripts/install_doxygen.sh
      - name: Check public header comments
        run: python Scripts/check_public_docs.py
      - name: Check Doxygen comment style
        run: python Scripts/check_doxygen_style.py
      - name: Build API documentation
        run: python Scripts/run_doxygen.py
