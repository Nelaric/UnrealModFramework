name: API Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.API_PAGES_ENABLED == 'true'
    name: Build API documentation
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Doxygen 1.18.0
        run: |
          mkdir -p "$RUNNER_TEMP/doxygen"
          if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz \
            -o "$RUNNER_TEMP/doxygen.tar.gz"; then
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 180 \
              https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz \
              -o "$RUNNER_TEMP/doxygen.tar.gz"
          fi
          printf '%s  %s\n' \
            '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90' \
            "$RUNNER_TEMP/doxygen.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP/doxygen"
          doxygen_bin="$(find "$RUNNER_TEMP/doxygen" -type f -name doxygen | head -n 1)"
          test -n "$doxygen_bin"
          echo "$(dirname "$doxygen_bin")" >> "$GITHUB_PATH"
      - name: Generate API documentation for publishing
        run: python Scripts/run_doxygen.py --publish
      - name: Arrange project documentation routes
        run: |
          mkdir -p .tools/pages/API
          cp -a .tools/api-docs/html/. .tools/pages/API/
          cp Docs/Hosting/project-index.html .tools/pages/index.html
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .tools/pages

  deploy:
    name: Publish API documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # Download by ID checks the same Actions artifact service that deploy-pages uses.
      - name: Check the uploaded Pages artifact
        id: check_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Wait for the artifact to become visible
        if: steps.check_artifact.outcome == 'failure'
        run: sleep 15
      - name: Retry checking the Pages artifact
        if: steps.check_artifact.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
