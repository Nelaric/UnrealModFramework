          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Build And Test Editor
        id: target
        uses: ./.github/actions/development-target
        env:
          CI_TARGET: windows-x64-editor
          CI_RUNNER: windows-2022
          CI_IDENTITY: ${{ needs.code-quality.outputs.identity }}
        with:
          phase: editor
          repository: ${{ needs.code-quality.outputs.source }}
          commit: ${{ needs.code-quality.outputs.commit }}
          sdk-token: ${{ secrets.UMFCI_READ_TOKEN }}

