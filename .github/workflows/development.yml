      metrics: ${{ steps.target.outputs.metrics }}
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resume Game Build
        id: target
        uses: ./.github/actions/development-target
        env:
          CI_TARGET: macos-arm64-game
          CI_RUNNER: macos-15
          CI_IDENTITY: ${{ needs.prepare-game-macos-arm64.outputs.identity }}
        with:
          phase: resume
          repository: ${{ needs.prepare-game-macos-arm64.outputs.source }}
          commit: ${{ needs.prepare-game-macos-arm64.outputs.commit }}
          checkpoint-id: ${{ needs.prepare-game-macos-arm64.outputs.artifact-id }}
          metadata-id: ${{ needs.editor-macos-arm64.outputs.artifact-id }}
          sdk-token: ${{ secrets.UMFCI_READ_TOKEN }}

  development-result:
    name: Development Result
    needs:
      - code-quality
      - native-tools
      - editor-windows-x64
      - editor-linux-x64
      - editor-macos-x64
      - editor-macos-arm64
      - prepare-game-windows-x64
      - prepare-game-windows-arm64
      - prepare-game-linux-x64
      - prepare-game-linux-arm64
      - prepare-game-macos-x64
      - prepare-game-macos-arm64
      - game-windows-x64
      - game-windows-arm64
      - game-linux-x64
      - game-linux-arm64
      - game-macos-x64
      - game-macos-arm64
    if: always() && needs.code-quality.outputs.engine == 'true'
    environment: development-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Aggregate Development Results
        if: always() && !cancelled()
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_IDENTITY: ${{ needs.code-quality.outputs.identity }}
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: python3 Scripts/CI/development.py aggregate
      - name: Create Status Publisher Token
        id: publisher
        if: steps.aggregate.outcome == 'success' && needs.code-quality.outputs.identity != '' && !cancelled()
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.UMF_STATUS_APP_ID }}
          private-key: ${{ secrets.UMF_STATUS_APP_PRIVATE_KEY }}
          owner: Nelaric
          repositories: UnrealModFramework
          permission-statuses: write
      - name: Publish Candidate Status
        id: publish
        if: steps.publisher.outcome == 'success' && !cancelled()
        env:
          CI_IDENTITY: ${{ needs.code-quality.outputs.identity }}
          PASSED: ${{ steps.aggregate.outputs.passed }}
          STATUS_TOKEN: ${{ steps.publisher.outputs.token }}
          PUBLIC_READ_TOKEN: ${{ github.repository == 'Nelaric/UnrealModFramework' && github.token || '' }}
        run: python3 Scripts/CI/development.py publish
      - name: Remove Consumed Artifacts
        if: success() && steps.aggregate.outputs.passed == 'true'
        env:
          ARTIFACT_IDS: ${{ steps.aggregate.outputs.artifact-ids }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: python3 Scripts/CI/development.py cleanup
      - name: Enforce Development Result
        if: always()
        env:
          PASSED: ${{ job.status == 'success' && steps.aggregate.outputs.passed == 'true' && steps.publish.outcome == 'success' }}
        run: |
          if [ "$PASSED" = true ]; then
            printf '**Final Result** Success\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '**Final Result** Failure\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
