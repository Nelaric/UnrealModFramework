name: Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.host.os }} ${{ matrix.host.arch }} · ${{ matrix.target }}
    runs-on: ${{ matrix.host.runner }}
    permissions:
      contents: read
    timeout-minutes: 300
    env:
      UE_USE_SYSTEM_DOTNET: ${{ matrix.host.platform == 'LinuxArm64' && '1' || '0' }}
      RECIPE: ${{ fromJSON(vars.UE_PACKAGE_RECIPES || '{}')[format('{0}_{1}', matrix.host.key, matrix.target)] || vars.UE_PACKAGE_RECIPE }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - {os: Windows, arch: x64, platform: Win64, runner: windows-2022, key: WINDOWS_X64}
          - {os: Windows, arch: arm64, platform: Win64, runner: windows-11-arm, key: WINDOWS_ARM64}
          - {os: macOS, arch: x64, platform: Mac, runner: macos-15-intel, key: MACOS_X64}
          - {os: macOS, arch: arm64, platform: Mac, runner: macos-15, key: MACOS_ARM64}
          - {os: Linux, arch: x64, platform: Linux, runner: ubuntu-24.04, key: LINUX_X64}
        target: [Game, Editor]
        include:
          - host: {os: Linux, arch: arm64, platform: LinuxArm64, runner: ubuntu-24.04-arm, key: LINUX_ARM64}
            target: Game
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: matrix.host.platform == 'LinuxArm64'
        with:
          dotnet-version: '8.0.x'
      - name: Check private package access
        shell: bash
        env:
          TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          APP_ID: ${{ vars.UE_PACKAGES_APP_ID }}
        run: |
          [[ "$TRUSTED_SOURCE" == true ]] || { echo "::error::A maintainer must verify this revision from a trusted branch."; exit 1; }
          [[ -n "$APP_ID" && "$RECIPE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Configure UE_PACKAGES_APP_ID and the pinned UE_PACKAGE_RECIPE."; exit 1; }
      - uses: actions/create-github-app-token@v2
        id: packages
        with:
          app-id: ${{ vars.UE_PACKAGES_APP_ID }}
          private-key: ${{ secrets.UE_PACKAGES_APP_PRIVATE_KEY }}
          owner: Nelaric
          repositories: UnrealEngine-CI
          permission-contents: read
      - name: Check out the standalone package verifier
        uses: actions/checkout@v4
        with:
          repository: Nelaric/UnrealEngine-CI
          ref: 7de95b002b99365b1de96eaa3cbf84ec15ba34da
          token: ${{ steps.packages.outputs.token }}
          persist-credentials: false
          sparse-checkout: |
            probe
            ueci
      - name: Prepare Linux build storage
        if: runner.os == 'Linux'
        shell: bash
        run: bash ueci/linux_disk.sh
      - name: Prepare macOS build storage
        if: runner.os == 'macOS'
        run: python -m ueci.mac_disk
      - name: Select the native workspace
        id: work
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          echo "path=$(python -m ueci.workspace)" >> "$GITHUB_OUTPUT"
      - name: Install the verified private development package
        shell: bash
        env:
          GH_TOKEN: ${{ steps.packages.outputs.token }}
          WORK: ${{ steps.work.outputs.path }}
        run: |
          system=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          python ueci/install_ci_engine.py "$WORK/ue" "$system" "${{ matrix.host.arch }}" "${{ matrix.target }}" "$RECIPE"
      - name: Prepare the x64 cooker runtime for the ARM64 Linux Game
        if: matrix.host.platform == 'LinuxArm64' && matrix.target == 'Game'
        run: python ueci/setup_linux_arm64_cooker.py
      - name: Compile, cook and run PackageProbe automation on the native target
        shell: bash
        env:
          WORK: ${{ steps.work.outputs.path }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.host.arch }}
        run: |
          set -o pipefail
          system=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          python -u -m ueci.probe "$WORK/ue" "$system-$ARCH" "$TARGET" "$WORK/probe" 2>&1 | tee "$WORK/probe.log" | python -u -c 'import sys; [print(line.rstrip()) for line in sys.stdin if line.startswith("PackageProbe verification: ")]'
      - name: Upload the standalone automation report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host.key }}-${{ matrix.target }}-evidence
          path: |
            ${{ steps.work.outputs.path }}/probe/Saved/PackageValidation/result.json
            ${{ steps.work.outputs.path }}/probe/Saved/PackageValidation/report/index.json
          if-no-files-found: error
          retention-days: 7

  result:
    name: Desktop build and automation
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require all desktop targets
        env:
          MATRIX_RESULT: ${{ needs.build.result }}
        run: test "$MATRIX_RESULT" = success
