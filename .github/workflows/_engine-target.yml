name: Build one locked UE target

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      producer:
        type: string
        required: true
      commit:
        type: string
        required: true
    secrets:
      UMFCI_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.target }}
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private && vars.UMF_ZERO_SPEND == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      TARGET: ${{ inputs.target }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Nelaric/UnrealModFramework
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Resolve immutable engine lock
        id: lock
        env:
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          python Scripts/engine_ci.py config "$TARGET" > "$RUNNER_TEMP/engine-lock-output"
          grep -Fx "runner=$RUNNER_LABEL" "$RUNNER_TEMP/engine-lock-output"
          cat "$RUNNER_TEMP/engine-lock-output" >> "$GITHUB_OUTPUT"
          python -c 'import os, pathlib; print("UMF_WORK=" + (pathlib.Path(os.environ["RUNNER_TEMP"]) / "umf").as_posix())' >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Nelaric/UMFCI
          ref: ${{ steps.lock.outputs.installer }}
          token: ${{ secrets.UMFCI_READ_TOKEN }}
          path: umfci
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ steps.lock.outputs.dotnet }}
      - if: inputs.target == 'linux-arm64-game'
        name: Prepare native Linux ARM64 compiler tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
      - name: Stream and verify SDK
        env:
          GH_TOKEN: ${{ secrets.UMFCI_READ_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check -r ../umfci/requirements.txt
          python Scripts/engine_ci.py install "$TARGET" ../umfci "$UMF_WORK"
      - if: inputs.target != inputs.producer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metadata-${{ inputs.producer }}-${{ inputs.commit }}
          path: ${{ env.UMF_WORK }}/Metadata
      - name: Run MBT target stages
        run: python Scripts/engine_ci.py build "$TARGET" "$UMF_WORK" "$COMMIT"
      - if: inputs.target == inputs.producer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metadata-${{ inputs.producer }}-${{ inputs.commit }}
          path: |
            ${{ env.UMF_WORK }}/Metadata/manifest.json
            ${{ env.UMF_WORK }}/Metadata/options.json
            ${{ env.UMF_WORK }}/Metadata/blueprints.json
            ${{ env.UMF_WORK }}/Metadata/inputs.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
