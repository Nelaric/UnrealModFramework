name: Release Validation

on:
  workflow_call:
    inputs:
      commit:
        description: Full reviewed Release Candidate commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  release_validation:
    name: Release Validation
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private && vars.UMF_ZERO_SPEND == 'true'
    runs-on: [self-hosted, Windows, X64, umf-release]
    timeout-minutes: 360
    env:
      RC_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Validate candidate input
        shell: pwsh
        run: |
          if ($env:RC_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'Use the full Release Candidate commit' }
          if (!$env:UMF_FULL_UE) { throw 'Configure a full UE installation on the authorized runner' }
          if (!$env:UMF_FULL_UE_COMMIT) { throw 'Set UMF_FULL_UE_COMMIT to the upstream commit of the UE installation' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Nelaric/UnrealModFramework
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Verify the Release Candidate
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "r-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m Test.SharedRuntime.release_validation --engine "$env:UMF_FULL_UE" --engine-commit "$env:UMF_FULL_UE_COMMIT" --work "$work" --commit "$env:RC_COMMIT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content -LiteralPath (Join-Path $work 'ReleaseValidation.json')
