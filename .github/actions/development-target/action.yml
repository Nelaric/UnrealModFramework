name: Development Target
description: Build an Editor, prepare a Game checkpoint, or restore and continue a Game build.
inputs:
  phase:
    description: Editor, prepare, or resume phase
    required: true
  repository:
    description: Reviewed source repository
    required: true
  commit:
    description: Reviewed immutable source commit
    required: true
  sdk-token:
    description: Read-only access to the private UMFCI installer and release
    required: false
  artifact-token:
    description: Read-only access to artifacts in this private run
    required: false
  checkpoint-id:
    description: Checkpoint producer artifact ID
    required: false
  checkpoint-name:
    description: Checkpoint producer artifact name
    required: false
  metadata-id:
    description: Metadata producer artifact ID
    required: false
  metadata-name:
    description: Metadata producer artifact name
    required: false
outputs:
  artifact-id:
    description: Published immutable artifact ID
    value: ${{ steps.metadata.outputs.artifact-id || steps.checkpoint.outputs.artifact-id }}
  artifact-name:
    description: Published artifact name including its producing attempt
    value: ${{ inputs.phase == 'editor' && steps.lock.outputs.metadata-name || steps.lock.outputs.checkpoint-name }}
  metrics:
    description: Validated build metrics for Development Result
    value: ${{ steps.metrics.outputs.value }}
runs:
  using: composite
  steps:
    - name: Checkout Source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.commit }}
        path: source
        persist-credentials: false
    - name: Set Up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
      with:
        python-version: '3.12'
        architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
    - name: Resolve Engine Lock
      id: lock
      shell: bash
      run: python Scripts/CI/build_target.py configure
    - name: Checkout Locked Engine Installer
      if: inputs.phase == 'editor' || inputs.phase == 'prepare'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: Nelaric/UMFCI
        ref: ${{ steps.lock.outputs.installer }}
        token: ${{ inputs.sdk-token }}
        path: umfci
        persist-credentials: false
    - name: Set Up Locked .NET SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: ${{ steps.lock.outputs.dotnet }}
    - name: Install Native Linux ARM64 Toolchain Prerequisites
      if: env.CI_TARGET == 'linux-arm64-game'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
    - name: Set Up Engine Installer Dependencies
      if: inputs.phase == 'editor' || inputs.phase == 'prepare'
      shell: bash
      run: python -m pip install --disable-pip-version-check -r umfci/requirements.txt
    - name: Install Engine SDK
      if: inputs.phase == 'editor' || inputs.phase == 'prepare'
      env:
        GH_TOKEN: ${{ inputs.sdk-token }}
      shell: bash
      run: python Scripts/CI/build_target.py install
    - name: Prepare Toolchain
      if: inputs.phase == 'editor' || inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py toolchain
    - name: Build Native Tools
      if: inputs.phase == 'editor' || inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py build-native-tools
    - name: Prepare LibClang
      if: inputs.phase == 'editor' || inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py prepare-libclang
    - name: Prepare Editor Bootstrap
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py prepare-editor-bootstrap
    - name: Export Metadata
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py export-metadata
    - name: Validate Metadata
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py validate-metadata
    - name: Seal Metadata Artifact
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py seal-metadata
    - name: Start Metadata Upload Timing
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py start-timing "Metadata Upload"
    - name: Upload Metadata
      if: inputs.phase == 'editor'
      id: metadata
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.lock.outputs.metadata-name }}
        path: ${{ steps.lock.outputs.metadata-path }}
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
    - name: Record Metadata Upload Time
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py finish-timing "Metadata Upload"
    - name: Build Normal Editor
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py build-editor
    - name: Run Automation Tests
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py test-editor
    - name: Verify Automation Test Results
      if: inputs.phase == 'editor'
      shell: bash
      run: python Scripts/CI/build_target.py verify-editor
    - name: Execute Metadata Independent Actions
      if: inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py prepare-game
    - name: Save Build Checkpoint
      if: inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py save-checkpoint
    - name: Validate Build Checkpoint
      if: inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py validate-checkpoint
    - name: Seal Build Checkpoint
      if: inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py seal-checkpoint
    - name: Start Checkpoint Upload Timing
      if: inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py start-timing "Checkpoint Upload"
    - name: Upload Checkpoint
      if: inputs.phase == 'prepare'
      id: checkpoint
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.lock.outputs.checkpoint-name }}
        path: ${{ steps.lock.outputs.checkpoint-path }}
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
    - name: Record Checkpoint Upload Time
      if: inputs.phase == 'prepare'
      shell: bash
      run: python Scripts/CI/build_target.py finish-timing "Checkpoint Upload"
    - name: Start Checkpoint Download Timing
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py start-timing "Checkpoint Download"
    - name: Check Checkpoint Artifact Identity
      if: inputs.phase == 'resume'
      env:
        ARTIFACT_TOKEN: ${{ inputs.artifact-token }}
        CHECKPOINT_ID: ${{ inputs.checkpoint-id }}
        CHECKPOINT_NAME: ${{ inputs.checkpoint-name }}
      shell: bash
      run: python Scripts/CI/build_target.py check-checkpoint-artifact
    - name: Download Checkpoint
      if: inputs.phase == 'resume'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        artifact-ids: ${{ inputs.checkpoint-id }}
        path: ${{ steps.lock.outputs.checkpoint-path }}
        merge-multiple: true
    - name: Record Checkpoint Download Time
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py finish-timing "Checkpoint Download"
    - name: Verify Downloaded Checkpoint
      if: inputs.phase == 'resume'
      env:
        ARTIFACT_TOKEN: ${{ inputs.artifact-token }}
        CHECKPOINT_ID: ${{ inputs.checkpoint-id }}
        CHECKPOINT_NAME: ${{ inputs.checkpoint-name }}
      shell: bash
      run: python Scripts/CI/build_target.py verify-checkpoint-artifact
    - name: Restore Engine From Checkpoint
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py restore-sdk
    - name: Restore Build Checkpoint
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py restore-checkpoint
    - name: Validate Restored Build Checkpoint
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py validate-checkpoint
    - name: Start Metadata Download Timing
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py start-timing "Metadata Download"
    - name: Check Metadata Artifact Identity
      if: inputs.phase == 'resume'
      env:
        ARTIFACT_TOKEN: ${{ inputs.artifact-token }}
        METADATA_ID: ${{ inputs.metadata-id }}
        METADATA_NAME: ${{ inputs.metadata-name }}
      shell: bash
      run: python Scripts/CI/build_target.py check-metadata-artifact
    - name: Download Metadata
      if: inputs.phase == 'resume'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        artifact-ids: ${{ inputs.metadata-id }}
        path: ${{ steps.lock.outputs.metadata-path }}
        merge-multiple: true
    - name: Record Metadata Download Time
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py finish-timing "Metadata Download"
    - name: Verify Downloaded Metadata
      if: inputs.phase == 'resume'
      env:
        ARTIFACT_TOKEN: ${{ inputs.artifact-token }}
        METADATA_ID: ${{ inputs.metadata-id }}
        METADATA_NAME: ${{ inputs.metadata-name }}
      shell: bash
      run: python Scripts/CI/build_target.py verify-metadata-artifact
    - name: Validate Downloaded Metadata
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py validate-metadata
    - name: Import Metadata
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py import-metadata
    - name: Resume Pending Build Actions
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py resume-game
    - name: Verify Link Receipt And Binary Architecture
      if: inputs.phase == 'resume'
      shell: bash
      run: python Scripts/CI/build_target.py verify-game
    - name: Collect Build Metrics
      if: always() && steps.lock.outcome == 'success'
      id: metrics
      shell: bash
      run: python Scripts/CI/build_target.py metrics
