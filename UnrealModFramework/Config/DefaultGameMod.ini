; API and Event IDs use the shared GameplayTags dictionary. Define them in
; Config/Tags/GameMod.ini or the GameplayTags editor.
; These choices define authoring values, not runtime behavior.

[ModExportMetadata]
+APIScopes=Global
+APIScopes=World
+APIScopes=Player
+APIThreads=GameThread
+APIThreads=AnyThread
+APIPermissions=WorldRead
+APIPermissions=WorldWrite
+APIFailureRules=ReturnError
+EventSourceScopes=Global
+EventSourceScopes=World
+EventSourceScopes=Player
+EventPublishRules=Immediate
