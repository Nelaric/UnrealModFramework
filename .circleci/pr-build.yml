version: 2.1

commands:
  checkout_pr_commit:
    steps:
      - checkout
      - run:
          name: Validate and check out the PR commit
          command: |
            set -euo pipefail
            python3 -c '
            import json
            import os

            event = json.loads(os.environ["PR_EVENT_JSON"])
            number = event["pr"]
            sha = event["sha"]
            if not isinstance(number, int) or number < 1 or not isinstance(sha, str):
                raise SystemExit("Invalid PR build request")
            print(number, sha)
            ' > /tmp/unrealmodframework-pr-info
            read -r pr_number pr_sha < /tmp/unrealmodframework-pr-info
            python3 Scripts/pr_build_policy.py "$pr_number" "$pr_sha"
            git fetch --no-tags https://github.com/Nelaric/UnrealModFramework.git "refs/pull/$pr_number/head"
            actual_sha="$(git rev-parse FETCH_HEAD)"
            test "$actual_sha" = "$pr_sha"
            git checkout --detach "$actual_sha"
            test "$(git rev-parse HEAD)" = "$pr_sha"
  pull_unreal_image:
    steps:
      - run:
          name: Prepare Unreal Engine 5.6.1 Linux image
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            : "${GHCR_USERNAME:?Set GHCR_USERNAME in CircleCI project settings}"
            : "${GHCR_TOKEN:?Set GHCR_TOKEN in CircleCI project settings}"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            docker pull ghcr.io/epicgames/unreal-engine:dev-slim-5.6.1
            image_spec=.circleci/ue-linux.Dockerfile
            if [ -f "$image_spec" ]; then
              docker build --tag umf-ue-build:5.6.1 - < "$image_spec"
            else
              git show "$UMF_CI_BASE_COMMIT:$image_spec" | docker build --tag umf-ue-build:5.6.1 -
            fi
            docker logout ghcr.io
  stage_project:
    steps:
      - run:
          name: Prepare writable Unreal project
          command: |
            set -euo pipefail
            project_dir="$(mktemp -d)"
            cp -a UnrealModFramework "$project_dir/UnrealModFramework"
            chmod -R a+rwX "$project_dir"
            printf 'export UE_PROJECT_DIR=%q\n' "$project_dir" >> "$BASH_ENV"
  compile_target:
    parameters:
      target:
        type: string
    steps:
      - run:
          name: Compile << parameters.target >> for Linux
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            : "${UE_PROJECT_DIR:?Project staging directory is missing}"
            docker run --rm --network none \
              --mount "type=bind,src=$UE_PROJECT_DIR,dst=/workspace" \
              --workdir /workspace/UnrealModFramework \
              umf-ue-build:5.6.1 sh -eu -c '
                tools=Plugins/ModRuntime/Tools
                export UMF_MHT_LIBCLANG=/usr/lib/llvm-18/lib/libclang.so.1
                export UMF_MHT_CLANG_RESOURCE_DIR="$(clang-18 -print-resource-dir)"
                sh "$tools/Build.sh" --target ModRuntimeUhtTools
                mbt="$tools/build/ModBuildTool/ModBuildTool"
                if "$mbt" --help | grep -Fq "build-ue-target"; then
                  exec "$mbt" build-ue-target \
                    --engine /home/ue4/UnrealEngine --project UnrealModFrameworkDev.uproject \
                    --target "$1" --platform Linux --configuration Development --architecture x64 --mode normal
                fi
                exec /home/ue4/UnrealEngine/Engine/Build/BatchFiles/Linux/Build.sh \
                  "$1" Linux Development -Project=/workspace/UnrealModFramework/UnrealModFrameworkDev.uproject \
                  -WaitMutex -NoHotReload
              ' sh "<< parameters.target >>"

jobs:
  build_game_linux:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PR_EVENT_JSON: "<< pipeline.trigger_parameters.webhook.body >>"
    steps:
      - checkout_pr_commit
      - pull_unreal_image
      - stage_project
      - compile_target:
          target: UnrealModFrameworkDev
  build_editor_linux:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PR_EVENT_JSON: "<< pipeline.trigger_parameters.webhook.body >>"
    steps:
      - checkout_pr_commit
      - pull_unreal_image
      - stage_project
      - compile_target:
          target: UnrealModFrameworkDevEditor
      - run:
          name: Run the C++ and Blueprint ChangeHealth Hook test on Linux
          command: |
            set -euo pipefail
            generated="$UE_PROJECT_DIR/UnrealModFramework/Intermediate/ModTools/ModHeaderTool/Generated"
            test_path=Nelaric.UnrealModFramework.Host.ChangeHealthDispatch
            test_name=ChangeHealthDispatch
            if ! find "$generated" -name HookSources.json -print -quit 2>/dev/null | grep -q .; then
              test_path=System.Core.String.AppendInt
              test_name=AppendInt
            fi
            docker run --rm --network none --mount "type=bind,src=$UE_PROJECT_DIR,dst=/workspace" \
              umf-ue-build:5.6.1 /home/ue4/UnrealEngine/Engine/Binaries/Linux/UnrealEditor \
              /workspace/UnrealModFramework/UnrealModFrameworkDev.uproject -unattended -nullrhi -nosound -nosplash \
              "-ExecCmds=Automation RunTests $test_path;SoftQuit" \
              -stdout -FullStdOutLogOutput -abslog=/workspace/ChangeHealth.log
            grep -F "Result={Success} Name={$test_name}" "$UE_PROJECT_DIR/ChangeHealth.log"
      - run:
          name: Compile the authoring editor with MDT for Linux
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            : "${UE_PROJECT_DIR:?Project staging directory is missing}"
            mkdir "$UE_PROJECT_DIR/.circleci"
            cp -a LICENSE NOTICE.md "$UE_PROJECT_DIR/"
            cp -a .circleci/build-editor-plugin.sh "$UE_PROJECT_DIR/.circleci/"
            docker run --rm --init --network none \
              --mount "type=bind,src=$UE_PROJECT_DIR,dst=/workspace" \
              --workdir /workspace \
              umf-ue-build:5.6.1 \
              bash .circleci/build-editor-plugin.sh

workflows:
  fork_pr_linux_build:
    when: pipeline.trigger.type == "webhook"
    jobs:
      - build_game_linux:
          filters:
            branches:
              only: main
      - build_editor_linux:
          filters:
            branches:
              only: main
